name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          VITE_WEB3FORMS_ACCESS_KEY: dedd58b9-c7bf-4331-acd4-984dacff55da
        run: |
          npm run build
          rm -f dist/assets/*.map

      - name: Deploy dist/ to Hostinger via lftp mirror
        if: env.FTP_PASSWORD != ''
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "u777250759.amitabhroy.bd,$FTP_PASSWORD" 82.25.102.204 << 'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 5
          set net:reconnect-interval-base 3
          mirror --reverse --only-newer --parallel=2 ./dist/ ./
          bye
          EOF
